<!DOCTYPE html>
<html>
<head>
  <title>Simple Weather App</title>
  <style>
    body {
      font-family: Arial;
      background: #e3f2fd;
      text-align: center;
      padding-top: 50px;
    }
    input, button {
      padding: 10px;
      font-size: 16px;
    }
    #weather {
      margin-top: 20px;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h1>Weather Website</h1>
  <input type="text" id="city" placeholder="Enter city name">
  <button onclick="getWeather()">Get Weather</button>

  <div id="weather"></div>

  <script>
    async function getWeather() {
      const city = document.getElementById('city').value.trim();
      const apiKey = '206802c814add4a3bfcd39dbf40cba92';
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric`;

      try {
        const response = await fetch(url);
        const data = await response.json();

        if (data.cod === 200) {
          document.getElementById('weather').innerHTML =
            `Temperature in ${data.name}: ${data.main.temp} °C`;
        } else {
          document.getElementById('weather').innerHTML = `City not found: ${data.message}`;
        }
      } catch (error) {
        document.getElementById('weather').innerHTML = 'Error fetching data!';
      }
    }
  </script>

</body>
</html>
